[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends(...) in argument defaults is the intended pattern
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
# The local ./alembic migrations folder must not be confused with the alembic package
known-third-party = ["alembic"]
